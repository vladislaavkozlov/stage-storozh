# Сторож прода Stage (15.10.2026). Раз в минуту проверяет app.wellstage.ru/health и
# онлайн-запись заведений (с 19.10.2026) и пишет Владу в Telegram, если что-то не
# отвечает. Работает на GitHub, вне Amvera: если упадёт весь регион Amvera, сторож
# упадёт не вместе с продом.
#
# Один запуск идёт почти 6 часов и сам проверяет раз в минуту: расписание «раз в 5
# минут» GitHub выполнял раз в 2-4 часа. Следующий запуск по расписанию ждёт в
# очереди и стартует, как только предыдущий закончится
#
# Состояние между запусками (лежит ли прод и когда последний раз напоминали) - в кэше
# GitHub: каждый запуск сохраняет новый ключ, следующий берёт самый свежий по префиксу
name: storozh-proda
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      proverka:
        description: 'Прислать в Telegram пробное сообщение'
        type: boolean
        default: false
concurrency:
  # Проверка связи идёт отдельно, иначе ждала бы в очереди за долгим запуском
  group: storozh-${{ inputs.proverka == true && 'proverka' || 'cikl' }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    # Сам себя запускает следом (05.11.2026): расписание GitHub после конца запуска
    # подхватывало следующий через час и больше - 04.11 сторож молчал 17:46-18:52
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Прошлое состояние
        uses: actions/cache/restore@v4
        with:
          path: state
          key: storozh-state-${{ github.run_id }}
          restore-keys: storozh-state-
      # Лимит на шаге, а не только на всём запуске (05.11.2026). 03.11 последняя проверка
      # затянулась, GitHub оборвал запуск целиком по лимиту 355 минут, и шаг «Новое
      # состояние» не выполнился: следующий запуск взял состояние шестичасовой давности
      # и записал в сводку «сторож не работал 9 ч», хотя он работал. Теперь обрывается
      # только этот шаг, а состояние сохраняется
      - name: Проверка прода
        timeout-minutes: 340
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          STOROZH_PROVERKA: ${{ inputs.proverka }}
          STOROZH_MINUTES: '330'
        run: node storozh.mjs
      - name: Новое состояние
        if: always() && inputs.proverka != true
        uses: actions/cache/save@v4
        with:
          path: state
          key: storozh-state-${{ github.run_id }}
      - name: Следующий запуск сразу
        if: always() && inputs.proverka != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run storozh.yml --ref ${{ github.ref_name }} -f proverka=false
  # GitHub выключает расписание в открытом репозитории, где 60 дней не было изменений.
  # Раз в месяц сторож сам делает пустой коммит, чтобы его не выключили
  keepalive:
    runs-on: ubuntu-latest
    if: github.event.schedule == '*/5 * * * *'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Пустой коммит раз в месяц
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $((now - last)) -gt 2592000 ]; then
            git config user.name storozh
            git config user.email storozh@users.noreply.github.com
            git commit --allow-empty -m "Сторож жив: раз в месяц, чтобы GitHub не выключил расписание"
            git push
          fi
